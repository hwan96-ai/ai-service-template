<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="AI Service Template — local, preview-first AI coding safety harness for Codex CLI and Claude Code">
  <title>AI Service Template</title>
  <desc>Local, preview-first AI coding safety harness for Codex CLI and Claude Code. Human-in-the-loop by default.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7faff"/>
      <stop offset="1" stop-color="#eef2f9"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f4fd1"/>
      <stop offset="1" stop-color="#3a7bd5"/>
    </linearGradient>
    <style>
      .title { font: 600 44px -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #0d1b2a; }
      .tag   { font: 400 19px -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #2f4a6b; }
      .chip  { font: 500 14px -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #1f3556; }
      .markText { font: 700 28px -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #ffffff; }
      .footer { font: 400 13px -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #5a6b85; }
    </style>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="320" fill="none" stroke="#dbe3f0" stroke-width="1"/>

  <!-- Logo mark -->
  <g transform="translate(60,80)">
    <rect x="0" y="0" width="120" height="120" rx="22" fill="url(#mark)"/>
    <text x="60" y="58" text-anchor="middle" class="markText">AI</text>
    <text x="60" y="92" text-anchor="middle" class="markText" style="font-size:18px;font-weight:500;">SAFE</text>
  </g>

  <!-- Title + tagline -->
  <g transform="translate(220,118)">
    <text class="title">AI Service Template</text>
    <text y="34" class="tag">Local, preview-first AI coding safety harness</text>
    <text y="60" class="tag">for Codex CLI &amp; Claude Code — human-in-the-loop by default</text>
  </g>

  <!-- Chips -->
  <g transform="translate(220,228)">
    <g>
      <rect x="0" y="0" width="120" height="32" rx="16" fill="#ffffff" stroke="#c8d3e4"/>
      <text x="60" y="21" text-anchor="middle" class="chip">Local</text>
    </g>
    <g transform="translate(132,0)">
      <rect x="0" y="0" width="138" height="32" rx="16" fill="#ffffff" stroke="#c8d3e4"/>
      <text x="69" y="21" text-anchor="middle" class="chip">Preview-first</text>
    </g>
    <g transform="translate(282,0)">
      <rect x="0" y="0" width="160" height="32" rx="16" fill="#ffffff" stroke="#c8d3e4"/>
      <text x="80" y="21" text-anchor="middle" class="chip">Human-in-the-loop</text>
    </g>
    <g transform="translate(454,0)">
      <rect x="0" y="0" width="120" height="32" rx="16" fill="#ffffff" stroke="#c8d3e4"/>
      <text x="60" y="21" text-anchor="middle" class="chip">Codex CLI</text>
    </g>
    <g transform="translate(586,0)">
      <rect x="0" y="0" width="140" height="32" rx="16" fill="#ffffff" stroke="#c8d3e4"/>
      <text x="70" y="21" text-anchor="middle" class="chip">Claude Code</text>
    </g>
    <g transform="translate(738,0)">
      <rect x="0" y="0" width="180" height="32" rx="16" fill="#ffffff" stroke="#c8d3e4"/>
      <text x="90" y="21" text-anchor="middle" class="chip">Windows + PowerShell</text>
    </g>
  </g>

  <!-- Footer note -->
  <text x="220" y="290" class="footer">No auto-commit · No auto-push · No deploy · No dependency install</text>
</svg>
